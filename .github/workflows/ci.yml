name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values: no connection is made at build time, but src/lib/env.ts
      # validates that these are present when the module loads.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      RESEND_API_KEY: re_ci_dummy_key
      CONTACT_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
